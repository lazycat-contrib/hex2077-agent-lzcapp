version: 1

project:
  root: .
  build_config: lzc-build.yml
  package_file: package.yml
  output: dist/community.lazycat.app.hex2077.lpk
  target_arch: amd64

update:
  strategy: publish
  allow_downgrade: false
  version_source:
    type: image
    image: hex2077
    bump: patch

build:
  toolchains: []
  run_buildscript: false

images:
  - id: hex2077
    target: service
    service: hex2077
    source: ghcr.io/justlovemaki/hex2077-agent
    channel: custom
    sort: created
    tag_regex: '^latest$'
    delivery:
      mode: mirror
      require_digest_match: true

stores:
  official:
    enabled: false
    skip_if_version_exists: false
    retry:
      enabled: false
  private:
    enabled: true
    skip_if_version_exists: true
    name: Hex2077
    summary: Published from GitHub Actions
